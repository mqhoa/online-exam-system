spring.application.name=online-exam-backend

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/online_exam
spring.datasource.username=${POSTGRES_USER:exam_user}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
app.ai.upload-dir=${AI_UPLOAD_DIR:./uploads/ai}
app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-3.8-flash}
